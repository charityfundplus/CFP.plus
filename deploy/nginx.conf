# CFP+ website nginx config (copied into the image by Dockerfile).
# Routing for existing pages is unchanged from the previous inline config.
server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Defense in depth behind .dockerignore: never serve any dotfile or
    # dot-directory (.git, .github, .env, ...). nginx decodes and normalises
    # the URI first, so /%2egit/ and //.git/ are covered too.
    location ~ /\. {
        return 404;
    }

    location ~ ^/[0-9]+(?:/[0-9]+)*/?$ {
        try_files $uri/index.html $uri /id/index.html;
    }

    location ~* \.md$ {
        types { }
        default_type text/plain;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
