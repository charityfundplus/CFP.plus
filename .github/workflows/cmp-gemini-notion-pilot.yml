name: CMP Gemini Notion Pilot

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Execution ID
        required: true
        default: WO-CH7-MODE-B-PILOT
  repository_dispatch:
    types: [cmp_work_order]

permissions:
  contents: read

jobs:
  run-pilot:
    runs-on: ubuntu-latest
    env:
      TARGET_PAGE_ID: 3bfcaac9a557819e82b0e3ae2b07943e
      CHALLENGE_TOKEN: 2026-08-18-1218
      TEST_STRING: '[CFP+ TEST 2026-08-18] Direct Write Verified'
      EXECUTION_ID: ${{ inputs.execution_id || github.event.client_payload.execution_id || format('WO-CH7-GH-{0}', github.run_id) }}
    steps:
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          test -n "${GEMINI_API_KEY}"
          test -n "${NOTION_TOKEN}"

      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
        run: |
          set -euo pipefail
          if [[ ! "$GEMINI_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'Invalid GEMINI_MODEL identifier'
            exit 1
          fi
          set +e
          HTTP_STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -o gemini-response.json -w '%{http_code}' \
            -d '{"contents":[{"parts":[{"text":"CFP+ CMP pilot acknowledgement. Return READY."}]}]}')
          CURL_EXIT=$?
          set -e
          export HTTP_STATUS CURL_EXIT
          python - <<'PY_DIAGNOSTIC'
          import json, os
          from pathlib import Path
          status = os.environ['HTTP_STATUS']
          curl_exit = int(os.environ['CURL_EXIT'])
          result = {'model': os.environ['GEMINI_MODEL'], 'http_status': status,
                    'transport_exit_code': curl_exit, 'response_valid': False,
                    'provider_status': 'UNKNOWN', 'result': 'FAIL'}
          try:
              body = json.loads(Path('gemini-response.json').read_text())
              error = body.get('error', {}) if isinstance(body, dict) else {}
              provider_status = error.get('status', 'UNKNOWN') if isinstance(error, dict) else 'UNKNOWN'
              if provider_status in {'NOT_FOUND', 'INVALID_ARGUMENT', 'PERMISSION_DENIED',
                                     'UNAUTHENTICATED', 'RESOURCE_EXHAUSTED', 'UNAVAILABLE'}:
                  result['provider_status'] = provider_status
              candidates = body.get('candidates', []) if isinstance(body, dict) else []
              result['response_valid'] = isinstance(candidates, list) and any(
                  isinstance(c, dict) and isinstance(c.get('content'), dict) and
                  isinstance(c['content'].get('parts'), list) and any(
                      isinstance(part, dict) and isinstance(part.get('text'), str) and
                      part['text'].strip() for part in c['content']['parts']) for c in candidates)
          except (OSError, ValueError, TypeError):
              pass
          if curl_exit == 0 and status == '200' and result['response_valid']:
              result['result'] = 'PASS'
          Path('gemini-call-status.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          raise SystemExit(0 if result['result'] == 'PASS' else 1)
          PY_DIAGNOSTIC

      - name: Upload sanitized Gemini diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-gemini-call-status
          path: gemini-call-status.json
          if-no-files-found: warn

      - name: Read locked Notion page blocks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H 'Notion-Version: 2022-06-28' \
            "https://api.notion.com/v1/blocks/${TARGET_PAGE_ID}/children?page_size=100" \
            > notion-before.json
          grep -q "${CHALLENGE_TOKEN}" notion-before.json

      - name: Resolve Integration Test Log anchor
        run: |
          python - <<'PY'
          import json
          d=json.load(open('notion-before.json'))
          for b in d.get('results',[]):
              t=b.get('type','')
              if t.startswith('heading_'):
                  txt=''.join(x.get('plain_text','') for x in b.get(t,{}).get('rich_text',[]))
                  if txt.strip()=='Integration Test Log':
                      open('anchor.txt','w').write(b['id'])
                      break
          else:
              raise SystemExit('anchor not found')
          PY

      - name: Append execution receipt to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          ANCHOR_ID=$(cat anchor.txt)
          python - <<'PY' > notion-write.json
          import json, os, datetime
          values=[
            'Execution ID: '+os.environ['EXECUTION_ID'],
            'Timestamp: '+datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'Actor: Gemini via CMP Executor',
            'Target Page ID: '+os.environ['TARGET_PAGE_ID'],
            'Observed Challenge Token: '+os.environ['CHALLENGE_TOKEN'],
            os.environ['TEST_STRING'],
          ]
          def p(v):
              return {'object':'block','type':'paragraph','paragraph':{'rich_text':[{'type':'text','text':{'content':v}}]}}
          print(json.dumps({'children':[p(v) for v in values]}))
          PY
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H 'Notion-Version: 2022-06-28' \
            -H 'Content-Type: application/json' \
            -X PATCH \
            "https://api.notion.com/v1/blocks/${ANCHOR_ID}/children" \
            --data @notion-write.json \
            > notion-write-response.json

      - name: Read back and verify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          ANCHOR_ID=$(cat anchor.txt)
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H 'Notion-Version: 2022-06-28' \
            "https://api.notion.com/v1/blocks/${ANCHOR_ID}/children?page_size=100" \
            > notion-after.json
          grep -q "${EXECUTION_ID}" notion-after.json
          grep -q "${TEST_STRING}" notion-after.json
          grep -q "${TARGET_PAGE_ID}" notion-after.json

      - name: Build redacted evidence receipt
        run: |
          python - <<'PY'
          import json, os, hashlib, datetime
          w=json.load(open('notion-write-response.json'))
          evidence={
            'execution_id':os.environ['EXECUTION_ID'],
            'target_page_id':os.environ['TARGET_PAGE_ID'],
            'read':'PASS','gemini_call':'PASS','write':'PASS','read_back':'PASS','match':True,
            'appended_block_ids':[x.get('id') for x in w.get('results',[])],
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          raw=json.dumps(evidence,sort_keys=True).encode()
          evidence['sha256']=hashlib.sha256(raw).hexdigest()
          open('cmp-evidence.json','w').write(json.dumps(evidence,indent=2))
          PY

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmp-gemini-notion-evidence
          path: |
            cmp-evidence.json
            gemini-response.json
            notion-write-response.json
