name: CMP meta Notion Controlled Pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Existing source read, private draft, or signed sandbox creation
        type: choice
        options: [read, draft, create-sandbox]
        default: read
        required: true

permissions:
  contents: read

concurrency:
  group: cmp-meta-notion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-pilot:
    # No auto-created fallback Environment or legacy broad token.
    if: ${{ vars.CMP_NOTION_APPROVAL_ENVIRONMENT != '' }}
    environment: ${{ vars.CMP_NOTION_APPROVAL_ENVIRONMENT }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CMP_APPROVAL_ENVIRONMENT: ${{ vars.CMP_NOTION_APPROVAL_ENVIRONMENT }}
      CMP_NOTION_READABLE_PAGE_IDS: ${{ vars.CMP_NOTION_READABLE_PAGE_IDS }}
      CMP_NOTION_SANDBOX_PARENT: ${{ vars.CMP_NOTION_SANDBOX_PARENT }}
      CMP_NOTION_SOURCE_PAGE: ${{ vars.CMP_NOTION_SOURCE_PAGE }}
      CMP_APPROVAL_PUBLIC_KEY: ${{ vars.CMP_APPROVAL_PUBLIC_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      META_MODEL: ${{ vars.META_MODEL }}
      CMP_APPROVAL_LEDGER_PATH: ${{ runner.temp }}/cmp-approval-ledger.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install executor dependencies
        run: python -m pip install -r cmp/executor/requirements.txt
      - name: Run existing outbound executor
        env:
          PILOT_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          CMP_NOTION_TOKEN: ${{ secrets.CMP_NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          CMP_NOTION_APPROVAL_JSON: ${{ secrets.CMP_NOTION_APPROVAL_JSON }}
          CMP_APPROVED_TEXT: ${{ secrets.CMP_APPROVED_TEXT }}
        run: python cmp/executor/run_provider_notion.py --provider meta --mode "$PILOT_MODE"
      - name: Upload only redacted receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cmp-meta-notion-receipt
          path: cmp-evidence.json
          if-no-files-found: warn
          retention-days: 7
