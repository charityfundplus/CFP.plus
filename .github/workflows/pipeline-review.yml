name: Pipeline review (no Cloud deployment)
on:
  pull_request:
    paths: ['cloudbuild.yaml', 'scripts/deploy_cloud_run.py', 'tests/pipeline/**', '.github/workflows/pipeline-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/pipeline -v
      - run: python -m py_compile scripts/deploy_cloud_run.py
      - run: git diff --check
