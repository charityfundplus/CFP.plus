name: CTTTC Universal Record CI v0.6.6

on:
  push:
    paths:
      - 'schemas/**'
      - 'tests/ctttc/**'
      - 'run_ctttc_v066_tests.py'
      - '.github/workflows/ctttc_ci.yml'
      - 'content/**'
      - 'scripts/build_priority_pages.py'
      - 'tests/website/**'
      - '**/*.html'
  pull_request:
    paths:
      - 'schemas/**'
      - 'tests/ctttc/**'
      - 'run_ctttc_v066_tests.py'
      - '.github/workflows/ctttc_ci.yml'
      - 'content/**'
      - 'scripts/build_priority_pages.py'
      - 'tests/website/**'
      - '**/*.html'

jobs:
  ctttc-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema==4.21.1
      - name: Execute CTTTC Comprehensive Test Suite v0.6.6
        run: python run_ctttc_v066_tests.py
      - name: Execute Unicode Duplicate Regression v0.6.6
        run: python -m tests.ctttc.duplicate_unicode_regression_v066

  numeric-content-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify editorial content, links and governance guards
        run: python tests/website/test_numeric_content.py

  public-readback-observation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated read-only browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cfp-browser" playwright@1.55.0
          "$RUNNER_TEMP/cfp-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Collect production findings without certifying Website PASS
        env:
          NODE_PATH: ${{ runner.temp }}/cfp-browser/node_modules
          EVIDENCE_DIR: public-readback-evidence
        run: node tests/website/public_browser_readonly.cjs
      - name: Preserve actual HTTP/render/TLS findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-numeric-readback
          path: public-readback-evidence
          if-no-files-found: error
