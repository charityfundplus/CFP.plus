name: ID Routing Sandbox Check

on:
  pull_request:
    paths: ['registry/**', 'id/**', 'tools/build_registry_index.py', 'tests/routing/**', 'Dockerfile', '.github/workflows/id-routing.yml']
  push:
    branches: [main]
    paths: ['registry/**', 'id/**', 'tools/build_registry_index.py', 'tests/routing/**']

permissions:
  contents: read

jobs:
  id-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python3 tests/routing/test_id_routing.py
