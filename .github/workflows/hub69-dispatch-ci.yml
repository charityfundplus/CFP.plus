name: HUB 69 dispatch + office sandbox CI

# Tests only. This workflow never posts comments, never deploys, and has read-only permissions.
on:
  pull_request:
    paths:
      - 'sandbox/hub69-dispatch/**'
      - 'sandbox/hub69-working-office/**'
      - '.github/workflows/hub69-dispatch-ci.yml'
  push:
    branches: ['claude/cool-euler-gnwkfm']
    paths:
      - 'sandbox/hub69-dispatch/**'
      - 'sandbox/hub69-working-office/**'
      - '.github/workflows/hub69-dispatch-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: P1 localStorage regression (real inline script, Node VM)
        run: node sandbox/hub69-working-office/test-localstorage.cjs
      - name: Dispatcher unit tests
        run: python -m unittest discover -s sandbox/hub69-dispatch/tests -v
      - name: Pilot replay (deterministic) must match committed evidence
        run: |
          python sandbox/hub69-dispatch/run.py plan --source file:sandbox/hub69-dispatch/fixtures/pilot-691121.json \
            --out /tmp/pilot --now 2026-11-13T12:00:00Z
          diff <(jq -S 'del(.meta.now)' /tmp/pilot/state.json) <(jq -S 'del(.meta.now)' sandbox/hub69-dispatch/evidence/pilot-691121/state.json)
          diff /tmp/pilot/outbox.json sandbox/hub69-dispatch/evidence/pilot-691121/outbox.json
