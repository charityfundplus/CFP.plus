name: Super Quantum Z Sandbox

on:
  pull_request:
    branches: [research/quantum-vault-v01]
    paths:
      - 'research/quantum-vault/**'
      - '.github/workflows/super_quantum_z_sandbox.yml'

permissions:
  contents: read

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build -t super-quantum-z-test research/quantum-vault
      - name: Verify offline experiments
        run: docker run --rm --network none super-quantum-z-test

  cudaq-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/quantum-vault
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned simulator and test dependencies
        run: python -m pip install -r sandbox-requirements.txt cudaq==0.17.0
      - name: Require the CUDA-Q CPU target
        run: python -c "import cudaq; cudaq.set_target('qpp-cpu'); assert cudaq.get_target().name == 'qpp-cpu'"
      - name: Verify CPU sandbox experiments
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/ci
          python -m pytest -p no:cacheprovider -q | tee evidence/ci/pytest.txt
          (
            cd evidence/ci
            sha256sum pytest.txt | tee SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: super-quantum-z-cpu-evidence
          path: research/quantum-vault/evidence/ci/
          if-no-files-found: error

  mcp-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/quantum-vault
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mcp-requirements.txt
      - run: python -m pytest -p no:cacheprovider -q test_mcp_recovery.py
