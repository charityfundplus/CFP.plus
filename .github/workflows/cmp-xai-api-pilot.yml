name: CMP xAI API Transport Pilot

on:
  push:
    branches:
      - review/cmp-xai-api-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Check xAI secret without exposing it
        shell: bash
        run: |
          echo "WORK_ORDER_ID: CMP-WO-XAI-API-PILOT-001"
          if [ -z "$XAI_API_KEY" ]; then
            echo "XAI_API_SECRET: MISSING"
            echo "MACHINE_TO_MACHINE_API_TRANSPORT: NOT VERIFIED"
            exit 1
          fi
          echo "XAI_API_SECRET: PRESENT"
          echo "API_REQUEST_EXECUTED: NO"
          echo "MACHINE_TO_MACHINE_API_TRANSPORT: NOT VERIFIED"
          echo "NUMERIC_ID_CHANGED: NO"
          echo "GOVERNANCE_APPROVED: NO"
          echo "CANONICAL_LOCKED: NO"
