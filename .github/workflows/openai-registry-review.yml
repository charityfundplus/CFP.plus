name: OpenAI Registry Review

on:
  pull_request:
    paths:
      - registry/**
      - scripts/validate_registry.py
      - scripts/requirements.txt
      - .github/workflows/openai-registry-review.yml
  push:
    branches:
      - main
      - develop
    paths:
      - registry/**
      - scripts/validate_registry.py
      - scripts/requirements.txt
      - .github/workflows/openai-registry-review.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Determine changed registry files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/changed_registry_files.txt"
          : > "$output_file"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- registry/ > "$output_file" || true
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- registry/ > "$output_file" || true
          fi

          sed -i '/^$/d' "$output_file"
          echo "file=$output_file" >> "$GITHUB_OUTPUT"

          echo "Changed registry files detected:"
          if [[ -s "$output_file" ]]; then
            cat "$output_file"
          else
            echo "(none; full registry scan will be used)"
          fi

      - name: Check OpenAI secret availability
        id: openai-secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; OpenAI review will be skipped."
          fi

      - name: Run registry validator
        id: validator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          command=(
            python scripts/validate_registry.py
            --registry-path registry
            --changed-files-file "${{ steps.changed-files.outputs.file }}"
            --json-report validation_report.json
            --markdown-report validation_report.md
            --repo "$REPOSITORY"
            --github-api-url "$GITHUB_API_URL"
          )

          if [[ -n "$PR_NUMBER" ]]; then
            command+=(--pr-number "$PR_NUMBER" --post-pr-comment)
          fi

          "${command[@]}"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-validation-report
          path: |
            validation_report.json
            validation_report.md
          if-no-files-found: error

      - name: Publish step summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.openai-secret.outputs.configured }}" == "true" ]]; then
            echo "- OPENAI_API_KEY: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- OPENAI_API_KEY: missing (OpenAI review skipped until the secret is added)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f validation_report.md ]]; then
            cat validation_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.validator.outputs.exit_code }}" != "0" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Registry review reported warnings/errors but the workflow remains informational by design." >> "$GITHUB_STEP_SUMMARY"
          fi
