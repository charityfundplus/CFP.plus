name: CMP Provider Notion Contract Tests
on:
  pull_request:
    paths:
      - 'cmp/executor/**'
      - '.github/workflows/cmp-*-notion-*.yml'
      - '.github/workflows/cmp-meta-content-pilot.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cmp/executor/requirements.txt
      - run: python -m unittest discover -s cmp/executor/tests -v
