[project]
name = "cfp-plus-backend-foundation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
