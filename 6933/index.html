<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFP+ Quốc Gia</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:0 auto;padding:32px 20px;line-height:1.6;color:#111}a{color:inherit}.id{font-size:2rem;font-weight:800}.card{border:1px solid #ddd;border-radius:16px;padding:20px;margin:18px 0}.muted{opacity:.7}</style></head><body><a href="/90">← Bảng Quốc Gia</a><div class="card"><div class="id" id="name">CFP+ Quốc Gia</div><p id="ids"></p><p id="call"></p></div><div class="card"><h2>AI 🤖 & Công Nghệ</h2><p id="ai">Đang tải dữ liệu…</p></div><div class="card"><h2>10 Chương CFP+</h2><p>Trang Quốc Gia được thiết kế để tiếp tục bổ sung dữ liệu theo 10 Chương từ 0 đến 9.</p></div><p class="muted">CFP+ Nâng Tầm AI 🤖 Thành Bạn Đồng Hành • Only Plus+ For Life.</p><script>const id=location.pathname.split('/').filter(Boolean)[0];fetch('/registry/country-route-map.json').then(r=>r.json()).then(m=>{const x=m[id]||{};document.title=(x.name||'CFP+ Quốc Gia')+' • CFP+';document.getElementById('name').textContent=(x.flag?x.flag+' ':'')+(x.name||'CFP+ Quốc Gia');document.getElementById('ids').textContent='ID AI Quốc Gia: '+id+(x.country_id?' • ID Quốc Gia: '+x.country_id:'');document.getElementById('call').textContent=x.calling_code?'Mã Gọi Quốc Tế: '+x.calling_code:'';document.getElementById('ai').textContent=x.developer_found?'Nhà Phát Triển AI đã được xác định. Tiếp tục bổ sung Developer → AI → Evidence.':'CFP+ AI 🤖 • Hỗ Trợ Tạm Thời • Pending Discovery. CFP+ AI hỗ trợ tìm kiếm, kết nối và bổ sung Nhà Phát Triển AI tương lai; không đại diện pháp lý cho quốc gia và không khẳng định quốc gia đã có AI riêng.'}).catch(()=>{document.getElementById('ids').textContent='ID AI Quốc Gia: '+id;document.getElementById('ai').textContent='CFP+ AI 🤖 • Hỗ Trợ Tạm Thời • Pending Discovery.'});</script></body></html>
