server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    # Missing numeric records must not become generic AI Office / HTTP 200.
    location ~ ^/[0-9]+(?:/[0-9]+)*/?$ {
        try_files $uri/index.html $uri =404;
    }
    location ~ (^|/)\. { return 404; }
    location / {
        try_files $uri/index.html $uri =404;
    }
}
